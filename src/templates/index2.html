<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <style>
        
        html, input, button {
            font-family: "Lato", sans-serif;
        }

        body {
            background-color: #F5F6FA;
            padding: 0px;
            margin: 0px;
        }
        nav{
            display: flex;
            justify-content: space-around;
            height: 70px;
            margin-top: 25px;
            margin-right: 100px;
            background-color: #fff;
            align-items: center;
        }
        .search{
            width: 80%;
            display: flex;
            padding: 9px 20px;
            align-items: flex-start;
            gap: 15px;
            flex-shrink: 0;
            border-radius: 19px;
            border: 0.6px solid #D5D5D5;
            background: #F5F6FA;
        }
        .container{
            width: 80%;
            margin: 0 auto;
        }
        .filter{
            display: inline;
            padding: 10px 18px;
            background-color: #fff;
            border: .3px solid #D5D5D5;
            border-radius: 8px;
        }
        .filter-each{
            background-color: #fff;
            margin: 0px;
            padding: 10px 18px;
            border: 0px;
            text-transform: capitalize;
        }
        .filter-border{
            border-right: .3px solid #d5d5d5;
        }
        .table-container {
            border-radius: 10px;
            overflow: hidden;
            border: .6px solid black;
          }
          
          table {
            width: 100%;
            vertical-align: middle;
            text-align: left;
            background-color: #fff;
            margin-top: 25px;
            border-spacing: 0;
            border-collapse: collapse;
          }
          th {
            padding: 15px;
            background-color: #F5F6FA;
          }
          td{
            padding: 20px;
          }
          tr {
            border-bottom: .6px solid #d5d5d5;
          }
          
          .box-shadow-design {
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.1);
          }
          .navigators{
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
          }
          .filter-rounded-borders{
            border: .6px solid #D5D5D5;
            border-radius: 10px;
          }
          .ticker-tag{
            text-transform: capitalize;
            padding: 10px;
          }
          @media only screen and (max-width: 767px){
            .container{
                width: 100%;
                padding: 5px;
            }
            nav{
                margin-right: 0px;
            }
            .search{
                width: 50%;
            }
            .filter{
                display: flex;
            }
            td { 
                overflow: hidden; 
                text-overflow: ellipsis; 
                word-wrap: break-word;
            }
            .box-shadow-design {
                box-shadow: 0 0 3px rgba(0, 0, 0, 0.1);
              }
              .navigators{
                width: 100%;
              }
          }
    </style>
</head>
<body>
<nav class="box-shadow-design">
    <h1>findb</h1>
    <input type="text" class="search"/>
</nav>
<div class="container">
    <h2>News Updates</h2>
    <div class="filter box-shadow-design">
        <button class="filter-each filter-border">Filter by</button>
        <button class="filter-each filter-border">14 feb 19</button>
        <button class="filter-each filter-border">Status</button>
        <button class="filter-each">reset filter &#8634; </button>
    </div>

    <div>
        <table class="table-container box-shadow-design">
            <thead>
                <tr>
                    <th>Date</th>
                <th>News</th>
                <th>Company</th>
                <th>Sentiment</th>
                </tr>
            </thead>
            <tbody>
                {%for record in records%}
                    <tr data-link="{{record[2]}}">
                        <td>{{record[1].strftime('%d %b, %Y')}}</td>
                        <td>{{record[0]}}</td>
                        <td>{{record[3]}}</td>
                        <td>
                            <span class="ticker-tag">{{record[3]}}</span>
                            {% if 'neutral' in record[4] %}
                                <span class="ticker-tag" style="background-color: #6226ef20; color: #6226EF; border-radius:4.5px">{{record[4]}}</span>
                            {% elif 'negative' in record[4] %}
                                <span class="ticker-tag" style="background-color: #fd4f46;">{{record[4]}}</span>
                            {% else %}
                            <span class="ticker-tag" style="background-color: #5ed75e; ">{{record[4]}}</span>
                            {% endif %}
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="navigators">
        <button class="filter-each box-shadow-design filter-rounded-borders">&#8701; Prev Date </button>
        <button class="filter-each box-shadow-design filter-rounded-borders">Next Date &#8702;</button>
    </div>
        
    </div>
</div>
</body>

</html>
